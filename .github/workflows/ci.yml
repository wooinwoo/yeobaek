name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 빌드 시 prisma.config.ts가 DATABASE_URL을 요구한다(스키마 로드용, 실제 DB 연결 아님).
      # CI에는 외부 DB가 없으므로 libSQL 파일 모드 더미 URL을 주입한다.
      DATABASE_URL: "file:./ci.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      # Playwright webServer가 빌드/기동/시드에 사용하는 더미 URL(외부 DB 불필요, sqlite 파일 모드).
      DATABASE_URL: "file:./e2e.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # webServer(playwright.config.ts)가 pnpm build && pnpm start를 직접 기동하고,
      # global-setup이 e2e.db에 스키마 push + 시드를 수행한다.
      - name: E2E (Playwright smoke)
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
