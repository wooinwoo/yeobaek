name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # 빌드 시 prisma.config.ts가 DATABASE_URL을 요구한다(스키마 로드용, 실제 DB 연결 아님).
      # CI에는 외부 DB가 없으므로 libSQL 파일 모드 더미 URL을 주입한다.
      DATABASE_URL: "file:./ci.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
